name: Validate Python project
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install server and helper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r agent/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py analyzer.py capture.py run.py agent/agent.py
      - name: Check server imports
        run: python -c "import app; print('Flask dashboard import OK')"
